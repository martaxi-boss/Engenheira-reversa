name: Import REA (one time)

on:
  push:
    paths:
      - '.github/workflows/import-rea-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'martaxi-boss/Engenheira-reversa'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Import pinned REA source as a separate directory
        shell: bash
        env:
          REA_COMMIT: 7a0c47bfa4259af859779000bf8bc8aaf16b35bd
        run: |
          set -euo pipefail
          test ! -e rea
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags --depth=1 https://github.com/morluto/rea.git "$REA_COMMIT"
          test "$(git rev-parse FETCH_HEAD)" = "$REA_COMMIT"
          git read-tree --prefix=rea/ -u 'FETCH_HEAD^{tree}'
          test -f rea/LICENSE
          test -f rea/README.md
          sed 's@path = third_party/@path = rea/third_party/@' rea/.gitmodules > .gitmodules
          cat > README.md <<'README'
          # Engenharia reversa

          Este repositório contém uma cópia do projeto **REA — Reverse Engineer Anything**, do autor [morluto](https://github.com/morluto/rea), na pasta [rea](rea/).

          - Projeto original: https://github.com/morluto/rea
          - Revisão importada: `7a0c47bfa4259af859779000bf8bc8aaf16b35bd`
          - Licença original: [MIT](rea/LICENSE)
          - Documentação e instruções: [README do REA](rea/README.md)

          A cópia preserva os ficheiros do projeto e as referências dos cinco submódulos originais. O ficheiro `.gitmodules` na raiz adapta os caminhos desses submódulos à pasta `rea/`.

          Nenhum código importado é executado por este processo de importação. Não foram instaladas dependências nem ativados serviços.
          README
          git add -A
          git diff --cached --check -- README.md .gitmodules
          git diff --cached --quiet && { echo "Import already present"; exit 0; }
          git commit -m "Import REA reverse engineering project at pinned commit"
          git push origin HEAD:main

      - name: Confirm imported files
        shell: bash
        run: |
          set -euo pipefail
          test -f rea/LICENSE
          test -f rea/README.md
          test -f .gitmodules
          test "$(git ls-files -s rea/third_party/binwalk | awk '{print $1}')" = "160000"
          echo "REA imported into rea/ with original license and five submodule references."
