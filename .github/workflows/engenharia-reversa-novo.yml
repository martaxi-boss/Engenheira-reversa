name: Engenharia Reversa final - verificar codigo original testado
on:
  push:
    branches:
      - main
      - align/engenharia-reversa-final-20261029
    paths:
      - 'engenharia-reversa/**'
      - '.gitmodules'
      - '.github/workflows/engenharia-reversa-novo.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engenharia-reversa-final-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verificacao-fonte-e-isolamento:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout sem carregar submodulos do legado
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Obter o codigo original EXATO da instalacao testada
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 engenharia-reversa/original
      - name: Validar identidade e codigo do verificador
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s engenharia-reversa/tests -p 'test_*.py' -v
          python3 -m py_compile engenharia-reversa/scripts/vps_verify_existing.py
          python3 engenharia-reversa/scripts/vps_verify_existing.py --help > /dev/null
          echo 'ENGINE_FINAL_SOURCE=PASS'
          echo 'ENGINE_VPS_EXISTING=/home/ubuntu/rea-original-upstream-680'
          echo 'ENGINE_VPS_PROOF=40915197781'
          echo 'ENGINE_FULL_DEPENDENCY_ISOLATION=PENDING'
          echo 'ENGINE_SKILL_END_TO_END=NOT_TESTED'
          echo 'ENGINE_VPS_REINSTALL=NONE'
