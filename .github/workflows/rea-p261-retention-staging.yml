name: REA P261 isolated retention regression
on:
  push:
    branches:
      - rea/p261-preserve-investigation-records-20261025
    paths:
      - "rea/src/application/binary/**"
      - ".github/workflows/rea-p261-retention-staging.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rea-p261-retention-regression
  cancel-in-progress: false
jobs:
  isolated-retention-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout original REA source fork
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 12
      - name: Node.js for original REA tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: rea/package-lock.json
      - name: Install dependencies in disposable runner only
        working-directory: rea
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify regression reproduces original P225 defect (negative control)
        working-directory: rea
        shell: bash
        run: |
          set -euo pipefail
          cp src/application/binary/BinarySession.ts "$RUNNER_TEMP/BinarySession.fixed.ts"
          git show 781b975e96c2889e6133fb686ac8f032db2a29d8:rea/src/application/binary/BinarySession.ts > src/application/binary/BinarySession.ts
          set +e
          npx --no-install vitest run src/application/binary/BinarySessionLiveness.test.ts -t "retains Evidence and Unknowns when a binary session closes" > "$RUNNER_TEMP/p261-negative-control.log" 2>&1
          status=$?
          set -e
          cp "$RUNNER_TEMP/BinarySession.fixed.ts" src/application/binary/BinarySession.ts
          if test "$status" -eq 0; then
            echo "REA_P261_UNPATCHED_CONTROL=FAIL_EXPECTED_REGRESSION_NOT_REPRODUCED"
            exit 1
          fi
          grep -q "1 failed" "$RUNNER_TEMP/p261-negative-control.log" || {
            echo "REA_P261_UNPATCHED_CONTROL=FAIL_AMBIGUOUS_NEGATIVE"
            exit 1
          }
          echo "REA_P261_UNPATCHED_CONTROL=EXPECTED_TEST_FAILURE_CONFIRMED"
      - name: Verify all existing binary and investigation regressions
        working-directory: rea
        run: npx --no-install vitest run src/application/binary src/application/investigation
      - name: Verify formatting of precise source change
        working-directory: rea
        run: npx --no-install oxfmt --check src/application/binary/BinarySession.ts src/application/binary/BinarySessionRecords.ts src/application/binary/BinarySessionLiveness.test.ts
